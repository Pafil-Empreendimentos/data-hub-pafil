# Stack da automação de reporting (WhatsApp + email), 100% self-hosted, sem
# nenhuma assinatura nova. Roda com Docker Engine dentro do WSL2, na mesma VM
# Windows onde vivem o Postgres de producao, a ingestao diaria (servico do
# Windows) e o gateway do Power BI.
#
# Sem `version:` no topo de proposito: o Compose v2 ignora o atributo e avisa
# que ele e obsoleto.
#
# Docker Engine, e nao Docker Desktop: o Desktop tem termos de licenca
# comercial dependendo do porte da empresa, e a decisao do projeto e nao
# adicionar assinatura nenhuma.
#
# ATENCAO a um detalhe de rede que nao e obvio: o Postgres esta na MESMA VM,
# mas do lado Windows, enquanto estes containers vivem dentro do WSL2. Sao
# duas pilhas de rede diferentes, entao "localhost" aqui dentro NAO e o
# localhost do Windows, e `host.docker.internal:host-gateway` resolve para a
# VM do WSL, nao para o Windows. Por isso o apelido `pafil-db` abaixo, que
# aponta para o IP da VM na rede da empresa (estavel, ao contrario do IP
# interno do WSL, que muda a cada reinicio). Ver README.md secao 3.

services:
  n8n:
    image: n8nio/n8n:latest
    container_name: pafil-n8n
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - N8N_BASIC_AUTH_ACTIVE=true
      - N8N_BASIC_AUTH_USER=${N8N_BASIC_AUTH_USER}
      - N8N_BASIC_AUTH_PASSWORD=${N8N_BASIC_AUTH_PASSWORD}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - GENERIC_TIMEZONE=America/Sao_Paulo
      - TZ=America/Sao_Paulo
      # Endereco pelo qual o n8n se enxerga de fora. Importa para o OAuth2 do
      # Outlook: a Redirect URL que o n8n mostra (e que precisa bater com a
      # cadastrada no Azure) sai daqui. Com o default, quem administra por
      # tunel SSH ate consegue usar o n8n, mas o consentimento volta com
      # "redirect_uri_mismatch". Aponte para o endereco real da VM.
      - WEBHOOK_URL=${WEBHOOK_URL:-http://localhost:5678/}
    volumes:
      - n8n_data:/home/node/.n8n
    extra_hosts:
      # Apelido fixo para o Postgres de producao. A credencial do n8n aponta
      # sempre para "pafil-db", entao mudanca de IP da maquina de producao se
      # resolve trocando uma linha do .env e subindo de novo, sem editar
      # credencial dentro do n8n (onde a senha teria que ser redigitada).
      - "pafil-db:${PG_HOST_IP}"
    depends_on:
      - capture-service
      - evolution-api

  capture-service:
    build: ./capture_service
    container_name: pafil-capture
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - CAPTURE_API_KEY=${CAPTURE_API_KEY}
    volumes:
      # Gerado uma vez por login_once.py (rodado localmente, fora do Docker).
      # Ver README.md desta pasta.
      - ./capture_service/storage_state.json:/app/storage_state.json:ro

  evolution-db:
    image: postgres:16-alpine
    container_name: pafil-evolution-db
    restart: unless-stopped
    environment:
      - POSTGRES_USER=evolution
      - POSTGRES_PASSWORD=${EVOLUTION_DB_PASSWORD}
      - POSTGRES_DB=evolution
    volumes:
      - evolution_db_data:/var/lib/postgresql/data
    # Banco isolado so para o estado interno do Evolution API (sessoes,
    # instancias). NAO e o Postgres de producao do Pafil -- essa separacao
    # e proposital, ver comentario no topo do arquivo.

  evolution-api:
    # Nome/tag confirmado em 26/ago/2026 na doc oficial (doc.evolution-api.com)
    # e no docker-compose.yaml do repo oficial (github.com/evolution-foundation/
    # evolution-api). O projeto muda rapido -- confira de novo se isto voltar a
    # falhar com "pull access denied".
    image: evoapicloud/evolution-api:latest
    container_name: pafil-evolution
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - AUTHENTICATION_API_KEY=${EVOLUTION_API_KEY}
      - DATABASE_PROVIDER=postgresql
      - DATABASE_CONNECTION_URI=postgresql://evolution:${EVOLUTION_DB_PASSWORD}@evolution-db:5432/evolution
    volumes:
      - evolution_instances:/evolution/instances
    depends_on:
      - evolution-db

  evolution-manager:
    # NAO USAR -- mantido so para referencia/reavaliacao futura.
    #
    # Ideia original: interface web oficial pra facilitar o pareamento via QR
    # code, evitando a instabilidade relatada no endpoint /instance/connect
    # da API. Na pratica, tanto "latest" (2.3.5) quanto "v2.0.0" (confirmado
    # em 26/ago/2026) travam em loop de restart com o mesmo erro de nginx
    # ("invalid value must-revalidate" -- issue #2093 do repo oficial), entao
    # o bug parece estar no script de inicializacao, nao numa versao especifica.
    #
    # O pareamento real acabou funcionando direto pela API (sem esse serviço):
    # POST /instance/create (com "qrcode": true) devolve o QR em
    # qrcode.base64; GET /instance/connect/{instanceName} gera um novo se o
    # primeiro expirar (o QR expira rapido, escaneie assim que gerar). Ver
    # README.md secao 4.
    image: evoapicloud/evolution-manager:v2.0.0
    container_name: pafil-evolution-manager
    restart: "no"
    profiles: ["manager-desativado"]
    ports:
      - "3000:80"
    depends_on:
      - evolution-api

volumes:
  n8n_data:
  evolution_db_data:
  evolution_instances:
